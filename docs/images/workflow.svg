<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">How Skill Lens works</title>
  <desc id="desc">Discover candidates, compare evidence, select a base, and customize it for your needs.</desc>
  <rect width="1200" height="260" rx="24" fill="#f6f5fc"/>
  <text x="50" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.2" fill="#6d59c9">A WORKFLOW FOR CHOOSING SKILLS</text>
  <g font-family="Arial, sans-serif">
